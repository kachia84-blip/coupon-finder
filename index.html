<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<title>쿠폰검색기</title>
<style>
@font-face{font-family:"Pretendard";src:url("fonts/pretendard-sub.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Tossface";src:url("fonts/tf02.woff2") format("woff2");font-display:swap;unicode-range:U+2708,U+1F4BB}
@font-face{font-family:"Tossface";src:url("fonts/tf07.woff2") format("woff2");font-display:swap;unicode-range:U+1F357,U+1F436}
@font-face{font-family:"Tossface";src:url("fonts/tf09.woff2") format("woff2");font-display:swap;unicode-range:U+1F3AE,U+1F455,U+1F484,U+1F4B3,U+1F4FA,U+1F6CD,U+1F9F8,U+1F9FB}
:root{
  --bg:#f6f4ef;--card:#fff;--ink:#1c1b19;--sub:#6d6a63;--line:#e6e2d9;
  --hot:#e8452c;--hot-soft:#fde9e4;--pay:#0f7b5f;--pay-soft:#e2f3ec;--chip:#efece5;--item:#2457c5;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141412;--card:#1f1e1b;--ink:#f1efe9;--sub:#a29e95;--line:#2f2d29;
  --hot:#ff6a4f;--hot-soft:#3a1d17;--pay:#3fc79c;--pay-soft:#16302a;--chip:#2a2925;--item:#7da2ff;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top,0px)) 0 12px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.upd{color:var(--sub);font-size:12.5px}
.kinds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:12px;background:var(--chip);padding:4px;border-radius:12px}
.kind{border:0;background:none;color:var(--sub);font:inherit;font-size:14px;font-weight:700;padding:8px 4px;border-radius:9px;cursor:pointer;line-height:1.2;min-width:0;white-space:nowrap}
@media(max-width:380px){.kind{font-size:12px}}
.top .actions{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.saved-toggle,.save{border:1px solid var(--line);background:var(--card);color:var(--sub);font:inherit;font-size:12px;padding:3px 7px;border-radius:6px;cursor:pointer}
.save{position:absolute;top:8px;right:8px;z-index:1}
.save[aria-pressed=true],.saved-toggle[aria-pressed=true]{color:var(--hot);border-color:var(--hot)}
.search{display:block;width:100%;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.search::placeholder{color:var(--sub)}
.it,.rw{position:relative}
.it .p{padding-top:25px}
.it .save,.rw .save{right:2px}
.rw{min-height:48px}
.switch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:10px}
.switch .cat{border-radius:9px;padding:8px 4px}
.cvs-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.cvs{min-width:0;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.cvs img{display:block;width:100%;aspect-ratio:1;object-fit:contain;margin-bottom:8px}
.cvs .store{font-size:12px;color:var(--sub)}
.cvs .name{font-size:14px;font-weight:600;margin:4px 0 8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.cvs .price{margin-top:6px;font-size:16px;font-weight:800}
.cvs .unit{font-size:13px;color:var(--hot)}
.more{display:block;margin:16px auto 0}
.kind small{display:block;font-size:11.5px;font-weight:500;margin-top:2px}
.kind[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.desc{margin:14px 2px 10px;color:var(--sub);font-size:13px}
.tk{display:grid;grid-template-columns:1fr 112px;background:var(--card);border-radius:16px;margin-bottom:12px;border:1px solid var(--line);position:relative;overflow:hidden;text-decoration:none;color:inherit}
.tk .l{padding:15px 14px 14px 16px;min-width:0}
.tk .r{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:30px 6px 12px;border-left:2px dashed var(--line);background:var(--hot-soft);text-align:center}
.tk .r b{font-size:24px;font-weight:900;letter-spacing:-.03em;color:var(--hot);line-height:1.05;word-break:keep-all}
.tk .r span{font-size:12px;font-weight:700;color:var(--hot)}
.tk::before,.tk::after{content:"";position:absolute;right:104px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.tk::before{top:-10px}.tk::after{bottom:-10px}
.brand{font-size:13px;font-weight:800;color:var(--hot);margin-bottom:3px}
.ttl{font-size:15px;font-weight:600;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center;font-size:12px;color:var(--sub)}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--ink)}
.chip.pay{background:var(--pay-soft);color:var(--pay)}
.chip.hot{background:var(--hot-soft);color:var(--hot)}
.bar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 6px;padding:0 16px}
.bar::-webkit-scrollbar{display:none}
.cat{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer}
.cat small{color:var(--sub);font-weight:500;margin-left:3px}
.cat[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat[aria-pressed=true] small{color:var(--bg);opacity:.7}
.sort{display:flex;gap:14px;margin:4px 2px 2px;font-size:13px}
.sort button{border:0;background:none;padding:4px 0;font:inherit;color:var(--sub);cursor:pointer}
.sort button[aria-pressed=true]{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:4px}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:3px 12px;padding:12px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;align-items:start}
.it .th{grid-row:1/3;width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--chip)}
.it .ph{display:flex;align-items:center;justify-content:center;font-family:"Tossface",sans-serif;font-size:32px;line-height:1}
.it .s{grid-column:2/-1}
.it .t{font-size:14.5px;font-weight:500;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.it .p{text-align:right;white-space:nowrap}
.it .p b{display:block;font-size:16px;font-weight:800;color:var(--item)}
.it .p s{font-size:12px;color:var(--sub)}
.it .s{color:var(--sub);font-size:12.5px}
.mk{display:inline-block;margin-left:4px;font-weight:700}
.mk.good{color:var(--pay)}.mk.bad{color:var(--hot)}
.rw{display:flex;justify-content:space-between;gap:10px;padding:9px 58px 9px 2px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--sub);text-decoration:none}
.rw span:last-child{flex:none;font-size:12px}
.empty{color:var(--sub);text-align:center;padding:24px 0;font-size:14px}
#list a{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.kind-hint{margin:12px 2px 0;color:var(--sub);font-size:12px}
.kind-sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
.kind-sheet[hidden]{display:none}
.kind-panel{width:100%;max-width:560px;min-width:0;max-height:100%;overflow-y:auto;background:var(--card);color:var(--ink);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.kind-title{margin:0 0 14px;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kind-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kind-options .cat{min-width:0;padding:10px 2px;border-radius:9px;min-height:44px}
.kind-sheet-actions{display:flex;gap:8px;margin-top:12px}
.kind-sheet-actions .cat{flex:1;min-width:0;min-height:44px;border-radius:9px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top"><h1>쿠폰검색기</h1><div class="actions"><span class="upd" id="upd">불러오는 중</span><button class="saved-toggle" id="saved-toggle" aria-pressed="false">찜 0</button></div></div>
  <input class="search" id="search" type="search" placeholder="치킨, 스타벅스, 라면…" aria-label="목록 검색">
  <div class="kinds" id="kinds"></div>
</header>
<p class="desc" id="desc"></p>
<div id="channel"></div>
<div id="tools"></div>
<div id="list"></div>
<p class="kind-hint">카드를 길게 누르면 종류를 옮길 수 있어요</p>
</div>
<div class="kind-sheet" id="kind-sheet" role="dialog" aria-modal="true" aria-labelledby="kind-title" hidden>
  <div class="kind-panel">
    <p class="kind-title" id="kind-title"></p>
    <div class="kind-options"><button class="cat" data-kind-fix="coupon">쿠폰</button><button class="cat" data-kind-fix="item">물건</button><button class="cat" data-kind-fix="abroad">해외직구</button><button class="cat" data-kind-fix="reward">적립</button></div>
    <div class="kind-sheet-actions"><button class="cat" id="kind-reset" hidden>원래대로</button><button class="cat" id="kind-close">닫기</button></div>
  </div>
</div>
<script>
const KINDS = {
  coupon:{name:"브랜드·쿠폰",desc:"매장·포장·배달·카페·편의점·영화처럼 가서 쓰는 할인과 쿠폰. 택배로 받는 상품은 싼 물건 탭에 있어요"},
  item:{name:"싼 물건",desc:"택배로 받는 쇼핑몰 상품 특가(쇼핑몰 쿠폰·카드 할인 포함). 줄 친 가격은 할인율로 거꾸로 계산한 원래 가격, 초록 글씨는 에누리 최저가 대비(상품명으로 찾은 참고값이라 가끔 다른 상품과 비교될 수 있어요)"},
  abroad:{name:"해외직구",desc:"달러($)로 파는 해외 쇼핑몰 특가(알리·아마존 등). 관부가세·배송비는 따로 확인하세요"},
  reward:{name:"적립·퀴즈",desc:"10원 받기, 퀴즈 정답, 추첨 이벤트 같은 소액 적립"},
};
let kind="coupon", all=[], cat="전체", sort="new", delay={};
let query="", saved=[], showSaved=false, cvs=null, channel="coupon", store="전체", event="전체", limit=60;
try{const s=JSON.parse(localStorage.getItem("saved")||"[]");if(Array.isArray(s)) saved=s.filter((d,i)=>d&&typeof d.url==="string"&&typeof d.title==="string"&&s.findIndex(x=>x&&x.url===d.url)===i)}catch(e){}
const kindFix=Object.create(null);
try{const f=JSON.parse(localStorage.getItem("kindFix")||"{}");if(f&&typeof f==="object"&&!Array.isArray(f)) Object.entries(f).forEach(([url,k])=>{if(typeof k==="string"&&Object.hasOwn(KINDS,k)) kindFix[url]=k})}catch(e){}
const CATS=["먹거리","생활·주방","뷰티·건강","패션·잡화","가전","전자·PC","게임·앱","취미·완구","유아·반려","여행·문화","통신·금융","기타"];
const CAT_EMOJI={"먹거리":"🍗","생활·주방":"🧻","뷰티·건강":"💄","패션·잡화":"👕","가전":"📺","전자·PC":"💻","게임·앱":"🎮","취미·완구":"🧸","유아·반려":"🐶","여행·문화":"✈️","통신·금융":"💳","기타":"🛍️"};
const categoryEmoji=d=>Object.hasOwn(CAT_EMOJI,d.category)?CAT_EMOJI[d.category]:CAT_EMOJI["기타"];
function applyKindFix(d){d.kind0=d.kind0||d.kind||"coupon";d.kind=kindFix[d.url]||d.kind0;return d}
const movedChip=d=>d.kind!==d.kind0?'<span class="chip">옮김</span>':"";
const SORTS={new:"최신순",hot:"인기순",save:"많이 싼 순"};
const t0=d=>d.posted_at?new Date(d.posted_at).getTime()-(delay[d.src]||0)*36e5:0;  // 큰 딜이 드문 출처는 몇 시간 뒤로
const SORTERS={new:(a,b)=>t0(b)-t0(a), hot:(a,b)=>((b.likes||0)+(b.comments||0)/3)*(1-(delay[b.src]||0)/12)-((a.likes||0)+(a.comments||0)/3)*(1-(delay[a.src]||0)/12)||t0(b)-t0(a),
  save:(a,b)=>(okSave(b)??(b.pct||-99))-(okSave(a)??(a.pct||-99))||t0(b)-t0(a)};
function okSave(d){return typeof d.save_pct==="number"&&d.save_pct>=-30?d.save_pct:null}
const $=id=>document.getElementById(id);
const won=n=>n==null?"":n.toLocaleString("ko-KR")+"원";
const ago=iso=>{if(!iso)return "";const n=Math.round((Date.now()-new Date(iso))/6e4);return n<60?`${Math.max(n,0)}분 전`:n<1440?`${Math.round(n/60)}시간 전`:`${Math.round(n/1440)}일 전`};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chip=t=>`<span class="chip ${/페이|Pay/.test(t)?"pay":"hot"}">${esc(t)}</span>`;
const strip=t=>t.replace(/^\s*\[[^\]]*\]\s*/,"").replace(/\s*\([^()]*\d[^()]*\)\s*$/,"");
const norm=s=>String(s??"").toLowerCase().replace(/\s/g,"");
const matches=d=>!query||[d.title,d.brand,d.shop,d.src,d.name].some(v=>norm(v).includes(query));
const day=n=>new Date(Date.now()+9*36e5+n*864e5).toISOString().slice(0,10);
const deadline=d=>d.deadline===day(0)?"오늘 마감":d.deadline===day(1)?"내일 마감":"";
const saveButton=d=>{const on=saved.some(s=>s.url===d.url);return `<button class="save" data-save="${esc(d.url)}" aria-pressed="${on}">${on?"찜함":"찜"}</button>`};
const priceOf=d=>d.kind==="coupon"?bigOf(d)[0]:d.kind==="reward"?"":d.price_usd?`$${d.price_usd}${d.price_from?"~":""}`:d.price_won?won(d.price_won)+(d.price_from?"~":""):d.pct?d.pct+"%":"";
function bigOf(d){
  if(d.pct) return [d.pct+"%", d.benefit||"할인"];
  if(d.won_off) return [won(d.won_off), "할인"];
  if((d.flags||[]).includes("1+1")) return ["1+1", d.price_won?won(d.price_won):""];
  if((d.flags||[]).includes("무료")) return ["무료", ""];
  if(d.price_won) return [won(d.price_won), "행사가"];
  return ["행사",""];
}
function tags(d){
  const f=(d.flags||[]).filter(x=>!["1+1","무료","기한"].includes(x));
  return [d.pay,...f, d.kind==="coupon"?deadline(d):"", d.deadline?`~${d.deadline.slice(5).replace("-","/")}`:""].filter(Boolean);
}
function render(){
  all.forEach(applyKindFix);
  saved.forEach(s=>{const d=all.find(d=>d.url===s.url);if(d) s.kind0=d.kind0;applyKindFix(s)});
  const cnt=k=>all.filter(d=>d.kind===k&&matches(d)).length;
  $("kinds").innerHTML=Object.entries(KINDS).map(([k,v])=>`<button class="kind" data-k="${k}" aria-pressed="${k===kind}">${v.name}<small>${cnt(k)}건</small></button>`).join("");
  $("desc").textContent=KINDS[kind].desc;
  $("saved-toggle").textContent=showSaved?"닫기":`찜 ${saved.length}`;
  $("saved-toggle").setAttribute("aria-pressed",showSaved);
  const C=cvs?cvs.filter(matches):[];
  $("channel").innerHTML=!showSaved&&kind==="coupon"&&cvs?`<div class="switch">${[["coupon",`핫딜 쿠폰 ${cnt("coupon")}`],["cvs",`편의점 행사 ${C.length}`]].map(([k,v])=>`<button class="cat" data-channel="${k}" aria-pressed="${channel===k}">${v}</button>`).join("")}</div>`:"";
  if(showSaved){
    $("desc").textContent="찜한 글을 최근에 담은 순서로 보여드려요";
    $("tools").innerHTML="";
    const L=[...saved].sort((a,b)=>(Date.parse(b.saved_at)||0)-(Date.parse(a.saved_at)||0)).filter(s=>matches({...all.find(d=>d.url===s.url),...s}));
    $("list").innerHTML=L.map(d=>`<a class="tk" href="${esc(d.url)}" target="_blank" rel="noopener">${saveButton(d)}<div class="l"><div class="brand">${esc(d.src)}</div><p class="ttl">${esc(d.title)}</p><div class="meta">${movedChip(d)}${all.some(x=>x.url===d.url)?"":chip("지난 글")}</div></div><div class="r"><b>${esc(all.find(x=>x.url===d.url)?priceOf(all.find(x=>x.url===d.url)):d.price)}</b></div></a>`).join("")||`<div class="empty">${query?"검색 결과가 없어요":"찜한 글이 없어요"}</div>`;
    return;
  }
  if(kind==="coupon"&&cvs&&channel==="cvs"){
    $("tools").innerHTML=`<div class="bar">${["전체","CU","세븐일레븐","이마트24"].map(s=>`<button class="cat" data-store="${s}" aria-pressed="${store===s}">${s}</button>`).join("")}</div><div class="bar">${["전체","1+1","2+1","그 밖"].map(s=>`<button class="cat" data-event="${s}" aria-pressed="${event===s}">${s}</button>`).join("")}</div>`;
    const L=C.filter(d=>(store==="전체"||d.store===store)&&(event==="전체"||(event==="그 밖"?!["1+1","2+1"].includes(d.event):d.event===event)));
    $("list").innerHTML=L.length?`<div class="cvs-grid">${L.slice(0,limit).map(d=>`<div class="cvs">${d.image?`<img src="${esc(d.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.hidden=true;this.style.display='none'">`:""}<div class="store">${esc(d.store)}</div><p class="name">${esc(d.name)}</p>${chip(d.event)}<div class="price">${won(d.price)}</div>${/^\d+\+1$/.test(d.event)&&Number.isInteger(d.unit)?`<div class="unit">개당 ${won(d.unit)}</div>`:""}</div>`).join("")}</div>${L.length>limit?`<button class="cat more" id="more">더 보기</button>`:""}`:`<div class="empty">${query?"검색 결과가 없어요":"지금은 행사가 없어요"}</div>`;
    return;
  }
  let L=all.filter(d=>d.kind===kind&&matches(d));
  let h="";
  if(kind==="item"){
    const counts={};L.forEach(d=>{const c=d.category||"기타";counts[c]=(counts[c]||0)+1});
    // 많은 분류부터(같으면 정해진 순서), 기타는 맨 뒤
    const order=c=>{const i=CATS.indexOf(c);return i<0?99:i};
    const cats=["전체",...Object.keys(counts).filter(c=>c!=="기타").sort((a,b)=>counts[b]-counts[a]||order(a)-order(b)),...(counts["기타"]?["기타"]:[])];
    if(!cats.includes(cat)) cat="전체";
    $("tools").innerHTML=`<div class="bar" id="cats">${cats.map(c=>`<button class="cat" data-c="${c}" aria-pressed="${c===cat}">${c}<small>${c==="전체"?L.length:counts[c]}</small></button>`).join("")}</div>
      <div class="sort" id="sorts">${Object.entries(SORTS).map(([k,v])=>`<button data-s="${k}" aria-pressed="${k===sort}">${v}</button>`).join("")}</div>`;
    if(cat!=="전체") L=L.filter(d=>(d.category||"기타")===cat);
    L=[...L].sort(SORTERS[sort]);
  } else $("tools").innerHTML="";
  if(kind==="coupon") L=[...L].sort((a,b)=>Number(b.deadline===day(0))-Number(a.deadline===day(0)));
  if(kind==="coupon") h=L.map(d=>{const [b,u]=bigOf(d);return `
    <a class="tk" href="${esc(d.url)}" target="_blank" rel="noopener">${saveButton(d)}<div class="l">
      <div class="brand">${esc(d.brand||d.shop||d.src)}</div>
      <p class="ttl">${esc(strip(d.title))}</p>
      <div class="meta">${movedChip(d)}${tags(d).map(chip).join("")}<span>${esc(d.src)} · ${ago(d.posted_at)}</span></div>
    </div><div class="r"><b>${esc(b)}</b><span>${esc(u)}</span></div></a>`}).join("");
  if(kind==="item"||kind==="abroad") h=L.map(d=>{
    const sp=d.save_pct;
    // 시중이 30% 넘게 싸면 다른 상품(낱개·묶음)과 잘못 짝지어진 경우가 대부분이라 숨김
    const mk=(d.market_low&&typeof sp==="number"&&sp>=-30)?`<span class="mk ${sp>0?"good":sp<0?"bad":""}">${sp>0?`시중 ${won(d.market_low)}보다 ${sp}% 쌈`:sp<0?`시중 최저 ${won(d.market_low)}이 더 쌈`:"시중가와 같음"}</span>`:"";
    const price=d.price_usd?`<b>$${esc(d.price_usd)}${d.price_from?"~":""}</b>`:d.price_won?`<b>${won(d.price_won)}${d.price_from?"~":""}</b>${d.orig_est?`<s>${won(d.orig_est)}</s>`:""}`:(d.pct?`<b>${d.pct}%</b>`:"");
    const pop=[d.likes?`추천 ${d.likes}`:"",d.comments?`댓글 ${d.comments}`:""].filter(Boolean).join(" ");
    return `<a class="it" href="${esc(d.url)}" target="_blank" rel="noopener">
      ${saveButton(d)}
      ${d.image?`<img class="th" src="${esc(d.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-ph="${categoryEmoji(d)}" onerror="const p=document.createElement('span');p.className='th ph';p.textContent=this.dataset.ph;this.replaceWith(p)">`:`<span class="th ph">${categoryEmoji(d)}</span>`}
      <span class="t">${esc(strip(d.title))}</span><span class="p">${price}</span>
      <span class="s">${movedChip(d)}${esc(d.src)}${d.also?" 외 "+d.also.length+"곳":""}${d.shop?" · "+esc(d.shop):""}${d.posted_at?" · "+ago(d.posted_at):""}${pop?" · "+pop:""}${d.membership?" · "+esc(d.membership):""}${mk}</span></a>`}).join("");
  if(kind==="reward") h=L.map(d=>`<a class="rw" href="${esc(d.url)}" target="_blank" rel="noopener">${saveButton(d)}<span>${esc(d.title)}${movedChip(d)}</span><span>${esc(d.src)}${d.posted_at?" · "+ago(d.posted_at):""}</span></a>`).join("");
  $("list").innerHTML=h||`<div class="empty">${query?"검색 결과가 없어요":"지금은 글이 없어요"}</div>`;
}
$("search").oninput=e=>{query=norm(e.target.value);limit=60;render()};
$("saved-toggle").onclick=()=>{showSaved=!showSaved;render()};
$("channel").onclick=e=>{const b=e.target.closest("[data-channel]");if(!b)return;channel=b.dataset.channel;limit=60;render()};
$("list").onclick=e=>{const b=e.target.closest("[data-save]");if(b){
  e.preventDefault();e.stopPropagation();const url=b.dataset.save,i=saved.findIndex(d=>d.url===url);
  if(i>=0) saved.splice(i,1);
  else{const d=all.find(d=>d.url===url);if(!d)return;saved.unshift({url:d.url,title:d.title,src:d.src,kind0:d.kind0,kind:d.kind,price:priceOf(d),saved_at:new Date().toISOString()})}
  try{localStorage.setItem("saved",JSON.stringify(saved))}catch(e){}
  render();
}else if(e.target.closest("#more")){limit+=60;render()}};
$("kinds").onclick=e=>{const b=e.target.closest(".kind");if(!b)return;kind=b.dataset.k;showSaved=false;render();scrollTo(0,0)};
$("tools").onclick=e=>{const c=e.target.closest(".cat"),s=e.target.closest("[data-s]");
  if(c&&("store" in c.dataset||"event" in c.dataset)){if("store" in c.dataset) store=c.dataset.store;else event=c.dataset.event;limit=60;render();return}
  if(c){cat=c.dataset.c;render();c.scrollIntoView&&$("cats").querySelector(`[data-c="${cat}"]`).scrollIntoView({inline:"center",block:"nearest"})}
  else if(s){sort=s.dataset.s;render()}};
let press=null, blockClick=false, sheetDeal=null, sheetReturn=null, bodyOverflow="";
function cancelPress(){if(press) clearTimeout(press.timer);press=null}
function openKindSheet(d,card){
  sheetDeal=d;sheetReturn=card;bodyOverflow=document.body.style.overflow;
  $("kind-title").textContent=d.title;
  $("kind-sheet").querySelectorAll("[data-kind-fix]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.kindFix===d.kind));
  $("kind-reset").hidden=!Object.hasOwn(kindFix,d.url);
  $("kind-sheet").hidden=false;document.body.style.overflow="hidden";document.querySelector(".wrap").inert=true;
  $("kind-sheet").querySelector('[aria-pressed="true"]').focus({preventScroll:true});
}
function closeKindSheet(){
  $("kind-sheet").hidden=true;document.body.style.overflow=bodyOverflow;document.querySelector(".wrap").inert=false;sheetDeal=null;
  (sheetReturn?.isConnected?sheetReturn:$("saved-toggle")).focus({preventScroll:true});
}
$("kind-sheet").onclick=e=>{
  if(e.target===$("kind-sheet")||e.target.closest("#kind-close")){closeKindSheet();return}
  const b=e.target.closest("[data-kind-fix],#kind-reset");if(!b||!sheetDeal)return;
  const k=b.dataset.kindFix,url=sheetDeal.url;
  if(!k||k===sheetDeal.kind0) delete kindFix[url];else kindFix[url]=k;
  try{localStorage.setItem("kindFix",JSON.stringify(kindFix))}catch(e){}
  render();closeKindSheet();
};
document.addEventListener("pointerdown",e=>{
  blockClick=false;cancelPress();
  if(!e.isPrimary||e.button!==0||!$("kind-sheet").hidden||e.target.closest("[data-save]"))return;
  const card=e.target.closest("#list a[href]");if(!card)return;
  const url=card.getAttribute("href"),d=all.find(d=>d.url===url)||saved.find(d=>d.url===url);if(!d)return;
  const p={id:e.pointerId,x:e.clientX,y:e.clientY,card,timer:0};press=p;
  p.timer=setTimeout(()=>{
    if(press!==p||!card.isConnected)return;
    blockClick=true;try{navigator.vibrate?.(15)}catch(e){}
    openKindSheet(d,card);
  },500);
},true);
document.addEventListener("pointermove",e=>{if(press&&e.pointerId===press.id&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>10) cancelPress()},true);
document.addEventListener("pointerup",cancelPress,true);
document.addEventListener("pointercancel",cancelPress,true);
document.addEventListener("scroll",cancelPress,true);
window.addEventListener("blur",cancelPress);
document.addEventListener("click",e=>{if(blockClick){blockClick=false;e.preventDefault();e.stopImmediatePropagation()}},true);
$("list").addEventListener("contextmenu",e=>{if(e.target.closest("a[href]"))e.preventDefault()});
document.addEventListener("keydown",e=>{
  if($("kind-sheet").hidden)return;
  if(e.key==="Escape"){e.preventDefault();closeKindSheet()}
  if(e.key==="Tab"){
    const buttons=[...$("kind-sheet").querySelectorAll("button")].filter(b=>!b.hidden),first=buttons[0],last=buttons[buttons.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});
render();
fetch("cvs.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(j=>{if(Array.isArray(j.items)){cvs=j.items;render()}}).catch(()=>{});
fetch("deals.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(j=>{
  all=j.deals; delay=j.src_delay||{}; const u=new Date(j.updated);
  $("upd").textContent=`갱신 ${u.getMonth()+1}/${u.getDate()} ${String(u.getHours()).padStart(2,"0")}:${String(u.getMinutes()).padStart(2,"0")}`;
  render();
}).catch(()=>{$("upd").textContent="불러오기 실패";if(!showSaved&&!(kind==="coupon"&&cvs&&channel==="cvs")) $("list").innerHTML=`<div class="empty">목록을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</div>`});
</script>
</body>
</html>
